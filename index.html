<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注音小達人｜第一～七關</title><style>
:root{--ink:#292d61;--purple:#6559d6;--pink:#9290ef;--cream:#e9ecff}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:radial-gradient(circle at 10% 10%,#b6c9ff,transparent 40%),radial-gradient(circle at 90% 90%,#b7a9f6,transparent 42%),#dce3ff;color:var(--ink);min-height:100vh}main{max-width:850px;margin:auto;padding:24px 16px 50px}.hero{text-align:center;margin:15px 0 22px}.hero h1{font-size:clamp(32px,6vw,53px);margin:0;color:#4335a8;text-shadow:3px 4px #d2d8ff}.hero p{font-size:17px}.card{background:#fff;border:4px solid #fff;border-radius:28px;box-shadow:0 13px 35px #5c538525;padding:26px;margin-top:16px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}.level{border:0;background:#e7e8ff;border-radius:20px;min-height:120px;cursor:pointer;color:#45318b;padding:15px;font:inherit;box-shadow:0 5px #dfd5ff;transition:transform .15s}.level:hover,.answer:hover{transform:translateY(-3px)}.level strong{display:block;font-size:22px}.level span{display:block;margin-top:8px;font-size:19px}.level small{display:block;margin-top:8px;color:#71649c}.level:nth-child(3n+2){background:#e2edff;box-shadow:0 5px #c9dbff;color:#355b9e}.level:nth-child(3n){background:#e7e0ff;box-shadow:0 5px #cfc5f8;color:#60439d}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.smallbtn{border:0;border-radius:13px;padding:10px 17px;font-size:16px;background:#ede8ff;color:#493b85;cursor:pointer}.badge{background:#f4edff;color:#644dc1;border-radius:99px;padding:10px 15px;font-weight:700}.bar{height:15px;background:#eeeaf5;border-radius:30px;overflow:hidden;margin:20px 0}.fill{height:100%;background:linear-gradient(90deg,#6698ed,#8364d8);width:0;transition:width .3s}.prompt{text-align:center;font-size:22px;margin:12px 0;color:#5e5b6d}.picture{text-align:center;font-size:clamp(78px,16vw,135px);margin:10px 0 4px}.word{text-align:center;font-size:clamp(36px,8vw,64px);font-weight:900;letter-spacing:5px;margin:25px 0}.hint{text-align:center;color:#726f82;font-size:16px;margin:12px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:24px 0}.answer{border:3px solid #ddd4ff;background:#f6f2ff;border-radius:24px;padding:20px 8px;min-height:110px;font-size:clamp(28px,5vw,43px);font-weight:800;color:#44358c;cursor:pointer;transition:transform .15s}.answer:nth-child(2){background:#e8eeff;border-color:#c7d4ff;color:#3a58a4}.answer:disabled{cursor:default;opacity:.8}.answer.correct{background:#d9f7dc;border-color:#61c875;color:#216b32;opacity:1}.answer.wrong{background:#ffe3e3;border-color:#f38d93;color:#9b3038;opacity:1}.feedback{font-size:24px;font-weight:800;text-align:center;min-height:40px}.next{display:block;margin:16px auto 0;border:0;border-radius:18px;background:#7255cc;color:#fff;padding:16px 34px;font-size:21px;font-weight:700;cursor:pointer}.next:disabled{background:#bbb}.end{text-align:center}.end .big{font-size:78px}.end h2{font-size:34px;color:#654dc3}.foot{text-align:center;color:#8a8393;margin-top:24px;font-size:14px}.hidden{display:none!important}@media(max-width:480px){.card{padding:16px}.answers{gap:9px}.answer{padding:13px 4px;min-height:94px;font-size:29px}}

/* 國小注音直式：每個字一欄，聲調置於該音節右側 */
.answer{display:flex;align-items:center;justify-content:center;gap:clamp(19px,3.5vw,32px);min-height:185px;line-height:1.1}

.zhuyin-symbol:last-child{position:relative}.zhuyin-tone{position:absolute;left:100%;top:-.27em;transform:translateX(-12%);font-size:1.02em;font-weight:900;line-height:1;z-index:1}

</style></head><body><main><header class="hero"><h1>🌟 注音小達人 🌟</h1><p>看一看、聽一聽、選一選！每關 10 題 🎈</p></header><section class="card" id="home"><h2 style="text-align:center">🎮 選擇挑戰關卡</h2><div class="levels" id="levels"></div><p class="hint">第七關每次會從動物題庫隨機抽出 10 題。</p></section><section class="card hidden" id="game"><div class="top"><button class="smallbtn" onclick="goHome()">⌂ 返回選關</button><span class="badge" id="levelTitle"></span><span class="badge" id="counter"></span></div><div class="bar"><div class="fill" id="fill"></div></div><p class="prompt" id="prompt"></p><div id="picture" class="picture hidden"></div><div id="word" class="word"></div><div style="text-align:center"><button class="smallbtn" id="speak" onclick="speakQuestion()">🔊 再聽一次</button></div><p class="hint" id="hint"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next hidden" id="next" onclick="nextQuestion()">下一題 ➜</button></section><section class="card end hidden" id="result"><div class="big" id="trophy">🏆</div><h2>挑戰完成！</h2><p id="summary" style="font-size:25px"></p><p id="message" style="font-size:19px"></p><button class="next" onclick="startLevel(active)">🔄 再玩一次</button><button class="smallbtn" style="margin:20px" onclick="goHome()">選擇其他關卡</button></section><p class="foot">教師教學使用｜可離線開啟｜語音播放依瀏覽器支援情況而定</p></main><script>

const lessons=[

{id:3,title:'第三關',topic:'ㄝ ／ ㄟ',items:[["寫字","ㄒㄧㄝˇ ㄗˋ","ㄒㄧㄟˇ ㄗˋ"],["飛機","ㄈㄟ ㄐㄧ","ㄈㄝ ㄐㄧ"],["鞋子","ㄒㄧㄝˊ ㄗ˙","ㄒㄧㄟˊ ㄗ˙"],["水杯","ㄕㄨㄟˇ ㄅㄟ","ㄕㄨㄟˇ ㄅㄝ"],["姐姐","ㄐㄧㄝˇ ㄐㄧㄝ˙","ㄐㄧㄟˇ ㄐㄧㄝ˙"],["黑色","ㄏㄟ ㄙㄜˋ","ㄏㄝ ㄙㄜˋ"],["樹葉","ㄕㄨˋ ㄧㄝˋ","ㄕㄨˋ ㄧㄟˋ"],["草莓","ㄘㄠˇ ㄇㄟˊ","ㄘㄠˇ ㄇㄝˊ"],["夜晚","ㄧㄝˋ ㄨㄢˇ","ㄧㄟˋ ㄨㄢˇ"],["背包","ㄅㄟˋ ㄅㄠ","ㄅㄝˋ ㄅㄠ"]]},

{id:6,title:'第六關',topic:'ㄧㄥ ／ ㄧㄣ',items:[["音樂","ㄧㄣ ㄩㄝˋ","ㄧㄥ ㄩㄝˋ"],["英文","ㄧㄥ ㄨㄣˊ","ㄧㄣ ㄨㄣˊ"],["開心","ㄎㄞ ㄒㄧㄣ","ㄎㄞ ㄒㄧㄥ"],["星星","ㄒㄧㄥ ㄒㄧㄥ˙","ㄒㄧㄣ ㄒㄧㄥ˙"],["金魚","ㄐㄧㄣ ㄩˊ","ㄐㄧㄥ ㄩˊ"],["眼睛","ㄧㄢˇ ㄐㄧㄥ","ㄧㄢˇ ㄐㄧㄣ"],["森林","ㄙㄣ ㄌㄧㄣˊ","ㄙㄣ ㄌㄧㄥˊ"],["鈴鐺","ㄌㄧㄥˊ ㄉㄤ","ㄌㄧㄣˊ ㄉㄤ"],["新聞","ㄒㄧㄣ ㄨㄣˊ","ㄒㄧㄥ ㄨㄣˊ"],["冰棒","ㄅㄧㄥ ㄅㄤˋ","ㄅㄧㄣ ㄅㄤˋ"]]},
{id:7,title:'第七關',topic:'動物注音大挑戰',animals:true,items:[['🐯','老虎','ㄌㄠˇ ㄏㄨˇ','ㄋㄠˇ ㄏㄨˇ'],['🦁','獅子','ㄕ ㄗ˙','ㄙ ㄗ˙'],['🐰','兔子','ㄊㄨˋ ㄗ˙','ㄉㄨˋ ㄗ˙'],['🐵','猴子','ㄏㄡˊ ㄗ˙','ㄏㄨˊ ㄗ˙'],['🦓','斑馬','ㄅㄢ ㄇㄚˇ','ㄅㄤ ㄇㄚˇ'],['🦒','長頸鹿','ㄔㄤˊ ㄐㄧㄥˇ ㄌㄨˋ','ㄔㄤˊ ㄐㄧㄣˇ ㄌㄨˋ'],['🦛','河馬','ㄏㄜˊ ㄇㄚˇ','ㄏㄨㄛˊ ㄇㄚˇ'],['🐧','企鵝','ㄑㄧˋ ㄜˊ','ㄐㄧˋ ㄜˊ'],['🐿️','松鼠','ㄙㄨㄥ ㄕㄨˇ','ㄕㄨㄥ ㄕㄨˇ'],['🦘','袋鼠','ㄉㄞˋ ㄕㄨˇ','ㄊㄞˋ ㄕㄨˇ'],['🐘','大象','ㄉㄚˋ ㄒㄧㄤˋ','ㄉㄚˋ ㄒㄧㄢˋ'],['🐼','熊貓','ㄒㄩㄥˊ ㄇㄠ','ㄒㄩㄣˊ ㄇㄠ'],['🐨','無尾熊','ㄨˊ ㄨㄟˇ ㄒㄩㄥˊ','ㄨˊ ㄨㄟˇ ㄒㄩㄣˊ'],['🐸','青蛙','ㄑㄧㄥ ㄨㄚ','ㄑㄧㄣ ㄨㄚ'],['🐢','烏龜','ㄨ ㄍㄨㄟ','ㄨ ㄍㄨㄞ'],['🦋','蝴蝶','ㄏㄨˊ ㄉㄧㄝˊ','ㄏㄨˊ ㄉㄧㄠˊ'],['🐬','海豚','ㄏㄞˇ ㄊㄨㄣˊ','ㄏㄞˇ ㄊㄨㄥˊ'],['🦈','鯊魚','ㄕㄚ ㄩˊ','ㄙㄚ ㄩˊ'],['🦉','貓頭鷹','ㄇㄠ ㄊㄡˊ ㄧㄥ','ㄇㄠ ㄊㄡˊ ㄧㄣ'],['🦊','狐狸','ㄏㄨˊ ㄌㄧˊ','ㄏㄨˊ ㄋㄧˊ'],['🐺','野狼','ㄧㄝˇ ㄌㄤˊ','ㄧㄝˇ ㄌㄢˊ'],['🐑','綿羊','ㄇㄧㄢˊ ㄧㄤˊ','ㄇㄧㄢˊ ㄧㄢˊ'],['🦆','鴨子','ㄧㄚ ㄗ˙','ㄧㄝ ㄗ˙'],['🐝','蜜蜂','ㄇㄧˋ ㄈㄥ','ㄇㄧˋ ㄈㄣ'],['🦀','螃蟹','ㄆㄤˊ ㄒㄧㄝˋ','ㄆㄢˊ ㄒㄧㄝˋ'],['🐙','章魚','ㄓㄤ ㄩˊ','ㄓㄢ ㄩˊ'],['🦜','鸚鵡','ㄧㄥ ㄨˇ','ㄧㄣ ㄨˇ'],['🦄','獨角獸','ㄉㄨˊ ㄐㄧㄠˇ ㄕㄡˋ','ㄊㄨˊ ㄐㄧㄠˇ ㄕㄡˋ'],['🐳','鯨魚','ㄐㄧㄥ ㄩˊ','ㄐㄧㄣ ㄩˊ'],['🦌','梅花鹿','ㄇㄟˊ ㄏㄨㄚ ㄌㄨˋ','ㄇㄝˊ ㄏㄨㄚ ㄌㄨˋ']]}
];
let active=1,questions=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(id){['home','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function goHome(){speechSynthesis?.cancel();show('home')}function renderLevels(){$('levels').innerHTML=lessons.map(l=>`<button class="level" onclick="startLevel(${l.id})"><strong>${l.title}</strong><span>${l.topic}</span><small>🎯 10 題挑戰 →</small></button>`).join('')}function startLevel(id){active=id;let l=lessons.find(x=>x.id===id);questions=shuffle(l.items).slice(0,10);index=0;score=0;show('game');renderQuestion()}function renderQuestion(){let l=lessons.find(x=>x.id===active),q=questions[index];locked=false;$('levelTitle').textContent=l.title+'｜'+l.topic;$('counter').textContent=`${index+1} / 10`;$('fill').style.width=`${index*10}%`;$('feedback').textContent='';$('next').classList.add('hidden');$('picture').classList.toggle('hidden',!l.animals);$('picture').textContent=l.animals?q[0]:'';$('word').textContent=l.animals?q[1]:q[0];$('prompt').textContent=l.animals?'🐾 看動物，選出正確的注音！':'🔍 選出這個詞語的正確注音！';$('hint').textContent='點選答案，答完可以再聽讀音';let right=l.animals?q[2]:q[1],wrong=l.animals?q[3]:q[2];let opts=shuffle([right,wrong]);$('answers').innerHTML=opts.map(v=>`<button class="answer" data-value="${v}" onclick="choose(this)">${verticalZhuyin(v)}</button>`).join('');setTimeout(speakQuestion,300)}function speakQuestion(){if(!('speechSynthesis' in window))return;let l=lessons.find(x=>x.id===active),q=questions[index];if(!q||$('game').classList.contains('hidden'))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(l.animals?q[1]:q[0]);u.lang='zh-TW';u.rate=.78;let voices=window.speechSynthesis.getVoices();let tw=voices.find(v=>v.lang.toLowerCase()==='zh-tw');if(tw)u.voice=tw;window.speechSynthesis.speak(u)}function verticalZhuyin(str){return str.trim().split(/\s+/).map(syl=>{let tone=(syl.match(/[ˊˇˋ˙]/)||[])[0]||'';let letters=syl.replace(/[ˊˇˋ˙]/g,'');return `<span class="zhuyin-syllable" aria-label="${syl}">${[...letters].map((c,i,a)=>`<span class="zhuyin-symbol">${c}${i===a.length-1&&tone&&tone!=='˙'?`<span class="zhuyin-tone">${tone}</span>`:''}</span>`).join('')}${tone==='˙'?`<span class="zhuyin-tone neutral">˙</span>`:''}</span>`}).join('')}
function choose(btn){if(locked)return;locked=true;let l=lessons.find(x=>x.id===active),q=questions[index],right=l.animals?q[2]:q[1],good=btn.dataset.value===right;if(good)score++;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.value===right)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=good?'🎉 答對了！真厲害！':'💪 再加油！正確答案已標示綠色';$('feedback').style.color=good?'#25924c':'#d07532';$('next').textContent=index===9?'看看成績 🏆':'下一題 ➜';$('next').classList.remove('hidden')}function nextQuestion(){if(index===9){$('fill').style.width='100%';$('summary').textContent=`答對 ${score} 題／共 10 題`; $('message').textContent=score===10?'太棒了！全部答對！':score>=7?'很棒喔！再練習就更熟練！':'繼續練習，你會越來越進步！';$('trophy').textContent=score===10?'🏆':score>=7?'🌟':'💖';show('result');return}index++;renderQuestion()}renderLevels();
</script></body></html>
